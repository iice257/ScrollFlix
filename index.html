<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- SEO Meta Tags -->
    <title>ScrollFlix: Spin a Globe of 100k+ Movies for Tonight's Pick</title>
    <meta name="description" content="Spin a 3D globe of 100k+ movie posters to discover films, pick by mood, shuffle for a surprise and watch trailers. Find tonight's watch on ScrollFlix." />
    <meta name="author" content="ICE" />
    <link rel="canonical" href="https://scrollflix.app/" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ScrollFlix: Spin a Globe of 100k+ Movies for Tonight's Pick" />
    <meta property="og:description" content="Spin a 3D globe of 100k+ movie posters to discover films, pick by mood, shuffle for a surprise and watch trailers. Find tonight's watch on ScrollFlix." />
    <meta property="og:url" content="https://scrollflix.app/" />
    <meta property="og:site_name" content="ScrollFlix" />
    <meta property="og:image" content="https://scrollflix.app/api/og?kind=default" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ScrollFlix: a globe of film posters" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@scrollflix" />
    <meta name="twitter:title" content="ScrollFlix: Spin a Globe of 100k+ Movies for Tonight's Pick" />
    <meta name="twitter:description" content="Spin a 3D globe of 100k+ movie posters to discover films, pick by mood, shuffle for a surprise and watch trailers. Find tonight's watch on ScrollFlix." />
    <meta name="twitter:image" content="https://scrollflix.app/api/og?kind=default" />
    <meta name="twitter:image:alt" content="ScrollFlix: a globe of film posters" />
    
    <!-- Additional Meta -->
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ScrollFlix" />
    
    <!-- Structured data. TODO: append TikTok, YouTube, Instagram and Reddit to Organization.sameAs once those accounts exist. -->
    <script type="application/ld+json" id="structured-data">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://scrollflix.app/#website",
            "url": "https://scrollflix.app/",
            "name": "ScrollFlix",
            "description": "Spin a 3D globe of 100k+ movie posters to discover films, pick by mood, shuffle for a surprise and watch trailers. Find tonight's watch on ScrollFlix.",
            "inLanguage": "en",
            "publisher": { "@id": "https://scrollflix.app/#organization" }
          },
          {
            "@type": "Organization",
            "@id": "https://scrollflix.app/#organization",
            "name": "ScrollFlix",
            "url": "https://scrollflix.app/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://scrollflix.app/icon-512.png",
              "width": 512,
              "height": 512
            },
            "sameAs": ["https://x.com/scrollflix"]
          },
          {
            "@type": "WebApplication",
            "@id": "https://scrollflix.app/#app",
            "name": "ScrollFlix",
            "url": "https://scrollflix.app/",
            "description": "Spin a 3D globe of 100k+ movie posters to discover films, pick by mood, shuffle for a surprise and watch trailers. Find tonight's watch on ScrollFlix.",
            "applicationCategory": "EntertainmentApplication",
            "operatingSystem": "Any",
            "browserRequirements": "Requires a browser with WebGL2",
            "isAccessibleForFree": true,
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "publisher": { "@id": "https://scrollflix.app/#organization" }
          }
        ]
      }
    </script>

    <!-- Robots -->
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
  </head>
  <body class="bg-background">
    <div id="root"></div>
    <script type="module" src="/app/main.tsx"></script>
  </body>
</html>
