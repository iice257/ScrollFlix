<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <!-- The catalogue manifest is the app's first request; start it with the HTML. -->
    <link rel="preload" href="/json/catalog/manifest.json" as="fetch" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- SEO Meta Tags -->
    <title>ScrollFlix: Spin a Globe of 100k+ Movies for Tonight's Pick</title>
    <meta name="description" content="Spin a 3D globe of 100k+ movie posters to discover films, pick by mood, shuffle for a surprise and watch trailers. Find tonight's watch on ScrollFlix." />
    <meta name="author" content="ICE" />
    <link rel="canonical" href="https://scrollflix.app/" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ScrollFlix: Spin a Globe of 100k+ Movies for Tonight's Pick" />
    <meta property="og:description" content="Spin a 3D globe of 100k+ movie posters to discover films, pick by mood, shuffle for a surprise and watch trailers. Find tonight's watch on ScrollFlix." />
    <meta property="og:url" content="https://scrollflix.app/" />
    <meta property="og:site_name" content="ScrollFlix" />
    <meta property="og:image" content="https://scrollflix.app/api/og?kind=default" />
    <meta property="og:image:width" content="720" />
    <meta property="og:image:height" content="378" />
    <meta property="og:image:alt" content="ScrollFlix: a globe of film posters" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@scrollflix" />
    <meta name="twitter:title" content="ScrollFlix: Spin a Globe of 100k+ Movies for Tonight's Pick" />
    <meta name="twitter:description" content="Spin a 3D globe of 100k+ movie posters to discover films, pick by mood, shuffle for a surprise and watch trailers. Find tonight's watch on ScrollFlix." />
    <meta name="twitter:image" content="https://scrollflix.app/api/og?kind=default" />
    <meta name="twitter:image:alt" content="ScrollFlix: a globe of film posters" />
    
    <!-- Additional Meta -->
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ScrollFlix" />
    
    <!-- Structured data. TODO: append TikTok, YouTube, Instagram and Reddit to Organization.sameAs once those accounts exist. -->
    <script type="application/ld+json" id="structured-data">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://scrollflix.app/#website",
            "url": "https://scrollflix.app/",
            "name": "ScrollFlix",
            "description": "Spin a 3D globe of 100k+ movie posters to discover films, pick by mood, shuffle for a surprise and watch trailers. Find tonight's watch on ScrollFlix.",
            "inLanguage": "en",
            "publisher": { "@id": "https://scrollflix.app/#organization" }
          },
          {
            "@type": "Organization",
            "@id": "https://scrollflix.app/#organization",
            "name": "ScrollFlix",
            "url": "https://scrollflix.app/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://scrollflix.app/icon-512.png",
              "width": 512,
              "height": 512
            },
            "sameAs": ["https://x.com/scrollflix"]
          },
          {
            "@type": "WebApplication",
            "@id": "https://scrollflix.app/#app",
            "name": "ScrollFlix",
            "url": "https://scrollflix.app/",
            "description": "Spin a 3D globe of 100k+ movie posters to discover films, pick by mood, shuffle for a surprise and watch trailers. Find tonight's watch on ScrollFlix.",
            "applicationCategory": "EntertainmentApplication",
            "operatingSystem": "Any",
            "browserRequirements": "Requires a browser with WebGL2",
            "isAccessibleForFree": true,
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "publisher": { "@id": "https://scrollflix.app/#organization" }
          }
        ]
      }
    </script>

    <!-- Boot screen: the loader's card, shown from the first paint until the app
         mounts its own (app/main.tsx removes it), so the page is never blank
         while the script downloads. -->
    <style>
      #boot-loader{position:fixed;inset:0;z-index:45;display:grid;place-items:center;background:radial-gradient(circle at 50% 52%,rgb(255 255 255/.07),transparent 34%),#000;color:rgb(255 255 255/.9);font:900 11px/1.3 "DM Sans",ui-sans-serif,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase}
      #boot-loader>span{display:grid;justify-items:center;gap:14px;width:min(320px,calc(100vw - 48px));border:1px solid rgb(255 255 255/.12);border-radius:24px;background:linear-gradient(180deg,rgb(255 255 255/.09),rgb(255 255 255/.04));padding:22px 22px 20px}
      #boot-loader strong{display:block;min-height:2.6em;align-content:center;font:inherit}
      #boot-loader i{display:block;width:100%;height:4px;border-radius:999px;background:rgb(255 255 255/.13);overflow:hidden}
      #boot-loader b{display:block;width:3%;height:100%;border-radius:inherit;background:#fff}
      #boot-loader small{display:block;margin-top:-6px;color:rgb(255 255 255/.56);font-size:10px;letter-spacing:.1em}
    </style>

    <!-- Robots -->
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
  </head>
  <body class="bg-background">
    <div id="boot-loader" aria-hidden="true"><span><strong>Building gallery</strong><i><b></b></i><small>0%</small></span></div>
    <div id="root"></div>
    <script type="module" src="/app/main.tsx"></script>
  </body>
</html>
