name: Update visual baselines

# Regenerates the committed visual baselines (playwright-tests/visual/__screenshots__)
# on the CI platform (ubuntu, Google Chrome) and commits them to the branch it
# runs on. Run it from the Actions tab or: gh workflow run update-visual-baselines.yml --ref <branch>
# A PR that changes baselines must show before/after images and needs King's approval.

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    name: Regenerate baselines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx playwright test -c playwright.visual.config.ts --workers=1 --update-snapshots

      - uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: playwright-tests/visual/__screenshots__/
          retention-days: 14

      - name: Commit baselines
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playwright-tests/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "Baselines unchanged."
          else
            git commit -m "test: update visual baselines"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
            # Pushes made with GITHUB_TOKEN never trigger workflows, so the PR
            # would sit with no checks. Dispatching CI on the branch is allowed,
            # and its checks attach to the new head SHA.
            gh workflow run ci.yml --ref "${GITHUB_REF_NAME}"
          fi
