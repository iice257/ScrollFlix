name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  # Also started by the "Update visual baselines" workflow: pushes made with
  # GITHUB_TOKEN never trigger push/pull_request runs, but this can be dispatched.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build

  # End-to-end tests: one job per Playwright project, each split into shards,
  # all running in parallel against a production build served by `vite preview`.
  # Every job builds for itself (about 15 s, catalogue pull included), which is
  # quicker than waiting on the checks job to hand over an artifact.
  e2e:
    name: E2E ${{ matrix.project }} (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Firefox and WebKit run in Playwright's own image, which already holds
    # every browser and system library: `playwright install --with-deps` is an
    # apt-get on a shared mirror and sometimes stalls for 10+ minutes. Chrome is
    # preinstalled on the runner, so its jobs run on the host. The image tag
    # must match the Playwright version in package-lock.json (checked below).
    container: ${{ (matrix.project == 'firefox' || matrix.project == 'Mobile Safari') && 'mcr.microsoft.com/playwright:v1.63.0-noble' || null }}
    strategy:
      fail-fast: false
      matrix:
        # Pull requests run one desktop and one mobile engine; pushes to
        # staging/main (which gate promotion) and manual runs run all four.
        project: ${{ fromJSON(github.event_name == 'pull_request' && '["Google Chrome","Mobile Safari"]' || '["firefox","Google Chrome","Mobile Chrome","Mobile Safari"]') }}
        # Playwright cuts shards into contiguous slices of the test list, so the
        # slow tests (@heavy: they wait a minute or more for the software-
        # rendered globe) would pile up in one shard. They get their own shards,
        # about one test each; everything else shares a few.
        part:
          - light 1/6
          - light 2/6
          - light 3/6
          - light 4/6
          - light 5/6
          - light 6/6
          - heavy 1/10
          - heavy 2/10
          - heavy 3/10
          - heavy 4/10
          - heavy 5/10
          - heavy 6/10
          - heavy 7/10
          - heavy 8/10
          - heavy 9/10
          - heavy 10/10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Builds dist/. This also pulls the film catalogue release into
      # public/json/catalog, so there is no separate catalog:pull step.
      - run: npm run build

      - name: Playwright image matches the installed Playwright
        if: matrix.project == 'firefox' || matrix.project == 'Mobile Safari'
        run: test "$(node -p "require('@playwright/test/package.json').version")" = "1.63.0"

      - name: Run tests
        run: |
          set -- ${{ matrix.part }}
          kind=$1
          shard=$2
          if [ "$kind" = heavy ]; then
            npx playwright test --project="${{ matrix.project }}" --shard="$shard" --grep @heavy --grep-invert @dev --pass-with-no-tests
          else
            npx playwright test --project="${{ matrix.project }}" --shard="$shard" --grep-invert "@dev|@heavy" --pass-with-no-tests
          fi

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: playwright-report/
          retention-days: 7

  # Specs tagged @dev need dev-only features (Shuffle Pro dev mode), which a
  # production build compiles away, so they run against the dev server. Chrome
  # only: Firefox and WebKit have no WebGL2 on the runner and skip them anyway.
  e2e-dev:
    name: E2E dev-mode specs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      # The dev server reads the catalogue from public/json/catalog.
      - run: npm run catalog:pull
      - run: npx playwright test --project="Google Chrome" --project="Mobile Chrome" --grep @dev
        env:
          E2E_SERVER: dev

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-dev
          path: playwright-report/
          retention-days: 7

  # The required check. Its name stays "End-to-end tests" while the real work
  # is spread over the jobs above; it fails if any of them did not succeed.
  e2e-gate:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: [e2e, e2e-dev]
    if: always()
    steps:
      - run: |
          echo "e2e: ${{ needs.e2e.result }}, e2e-dev: ${{ needs.e2e-dev.result }}"
          test "${{ needs.e2e.result }}" = success
          test "${{ needs.e2e-dev.result }}" = success

  # The visual gate: pixel baselines for the globe and its screens, in its own
  # job so it reports even when another e2e test fails. See
  # playwright-tests/visual/README.md.
  visual:
    name: Visual (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      # Uses the runner's installed Google Chrome, a mocked catalogue and mocked posters.
      - run: npm run test:visual -- --fully-parallel --shard="${{ matrix.shard }}"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diffs-${{ strategy.job-index }}
          path: |
            test-results/visual/
            playwright-report/visual/
          retention-days: 14

  # The required check for the visual shards above; the name is unchanged.
  visual-gate:
    name: Visual baselines
    runs-on: ubuntu-latest
    needs: [visual]
    if: always()
    steps:
      - run: test "${{ needs.visual.result }}" = success
