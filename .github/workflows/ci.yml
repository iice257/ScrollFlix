name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      # The app loads the film catalogue from public/json/catalog, which is
      # published as a release asset rather than kept in the repository.
      - run: npm run catalog:pull
      # Chrome projects use the runner's installed Google Chrome; Firefox and WebKit come from Playwright.
      - run: npx playwright install --with-deps firefox webkit
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The visual gate: pixel baselines for the globe and its screens, in its own
  # job so it reports even when another e2e test fails. See
  # playwright-tests/visual/README.md.
  visual:
    name: Visual baselines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      # Uses the runner's installed Google Chrome, a mocked catalogue and mocked posters.
      - run: npm run test:visual

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diffs
          path: |
            test-results/visual/
            playwright-report/visual/
          retention-days: 14
