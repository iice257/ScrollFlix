name: Smoke check
description: Runs playwright-tests/smoke.spec.ts against a deployed URL (read-only, no dev server).

inputs:
  base-url:
    description: URL to test, e.g. https://scrollflix.app
    required: true
  expect-sha:
    description: If set, /version.json on the URL must serve this commit.
    required: false
    default: ''
  browser:
    description: '"true" runs the in-browser boot test too (installs Chromium); "false" runs the HTTP checks only.'
    required: false
    default: 'true'
  bypass-secret:
    description: Vercel automation bypass secret for protected previews (optional).
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version-file: .nvmrc
        cache: npm

    - run: npm ci --ignore-scripts
      shell: bash

    - if: inputs.browser == 'true'
      run: npx playwright install --with-deps chromium
      shell: bash

    - name: Run smoke checks
      shell: bash
      env:
        CI: 'true'
        BASE_URL: ${{ inputs.base-url }}
        EXPECT_SHA: ${{ inputs.expect-sha }}
        VERCEL_AUTOMATION_BYPASS_SECRET: ${{ inputs.bypass-secret }}
        BROWSER: ${{ inputs.browser }}
      run: |
        args=()
        if [ "$BROWSER" != "true" ]; then args+=(--grep-invert "@browser"); fi
        npx playwright test -c playwright.smoke.config.ts "${args[@]}"
